# herdr configuration — mirrors ~/.config/tmux/tmux.conf (keybindings only)

onboarding = false

[keys]
# Trigger = `
prefix = "backtick"

# bind f resize-pane -Z
zoom = "prefix+f"

# Already matching tmux by default, listed here so they're explicit:
#   bind - split-window -v / bind v split-window -h
split_horizontal = "prefix+minus"
split_vertical = "prefix+v"
#   bind h/j/k/l select-pane -L/-D/-U/-R
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

[ui]
# set -g mouse on
mouse_capture = true

# Mauve accent for tabs, borders and nav UI
# accent = "#cba6f7"
accent = "#D6B8F9"

# Frame every pane, not just splits, and label it with the detected agent
pane_borders = "always"
pane_outer_borders = true
show_agent_labels_on_pane_borders = true

[advanced]
# set -g history-limit 10000 (herdr caps by bytes, not lines)
scrollback_limit_bytes = 10000000

[theme]
# Pin the default explicitly (mocha-style purple base)
name = "catppuccin"

[ui.sidebar.agents]
# name on row 1, state + agent on row 2
rows = [["state_icon", "tab"], ["state_text", "agent"]]
